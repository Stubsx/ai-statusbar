name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check source, tests, privacy and build scripts
        run: ./scripts/check-open-source.sh
      - name: Build universal app
        run: ./AIStatusBar/build.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict AIStatusBar/灵眸.app
          lipo -archs AIStatusBar/灵眸.app/Contents/MacOS/AIStatusBar | grep -q arm64
          lipo -archs AIStatusBar/灵眸.app/Contents/MacOS/AIStatusBar | grep -q x86_64
          expected="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 | sed 's/^v//')"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' AIStatusBar/灵眸.app/Contents/Info.plist)"
          test "$actual" = "$expected"
